# Coolify: Build Pack "Docker Compose", Docker Compose Location "/docker-compose.yaml". Setup: docs/coolify.md
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Direct access via http://<server-ip>:8787 (plain HTTP, bypasses Coolify's proxy).
    # Remove this block once a domain with ":8787" is configured in Coolify.
    ports:
      - "8787:8787"
    environment:
      # Coolify generates a domain and routes it to container port 8787 (changeable under "Domains").
      - SERVICE_URL_APP_8787
      # Protects the admin area (/api/admin, /api/jobs). Empty = open. Set it under Environment Variables in Coolify.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - YRPA_VERIFY_ALL_TRACKS=${YRPA_VERIFY_ALL_TRACKS:-1}
      - YRPA_TRACK_VERIFY=${YRPA_TRACK_VERIFY:-1}
      - YRPA_DEDUP_COOLDOWN_SECONDS=${YRPA_DEDUP_COOLDOWN_SECONDS:-900}
    volumes:
      # SQLite database + generated reports. Without this volume every deploy starts with an empty database.
      - music-scraper-data:/data

volumes:
  music-scraper-data:
